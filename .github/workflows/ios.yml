name: Build iOS

on:
  push:
    branches: [main]
    paths-ignore: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit + UI tests (simulator, screenshots of every screen)
        env:
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/screenshots
        run: |
          set -o pipefail
          xcodebuild test -project RA7ALCarTV.xcodeproj -scheme RA7ALCarTV \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | xcbeautify

      - name: Upload screenshots and test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            test.log
          retention-days: 14

      - name: Publish screenshots to the ci-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/shots && cp -R screenshots/. /tmp/shots/ 2>/dev/null || true
          tail -n 300 test.log > /tmp/shots/test-tail.log 2>/dev/null || true
          cd /tmp/shots
          git init -q && git checkout -q -b ci-screenshots
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Screenshots for ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Build unsigned IPA
        run: |
          xcodebuild build -project RA7ALCarTV.xcodeproj -scheme RA7ALCarTV \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" | xcbeautify || exit ${PIPESTATUS[0]}
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RA7ALCarTV.app Payload/
          zip -qry RA7AL-CarTV-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: RA7AL-CarTV-iOS
          path: RA7AL-CarTV-unsigned.ipa
          retention-days: 14

      - name: Publish IPA to the builds branch
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/RA7AL-CarTV-unsigned.ipa" /tmp/RA7AL-CarTV.ipa
          cd /tmp && rm -rf b
          if ! git clone -q --depth 1 -b builds "$REMOTE" b; then
            mkdir b && cd b && git init -q && git checkout -q -b builds && git remote add origin "$REMOTE" && cd ..
          fi
          cd b && cp /tmp/RA7AL-CarTV.ipa . 
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA}" || exit 0
          git push -q origin builds || (git pull -q --rebase origin builds && git push -q origin builds)
