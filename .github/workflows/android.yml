name: Build Android (Huawei)

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests + release APK
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleRelease assembleDebugAndroidTest assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Screen tour on emulator (every page, screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disable-animations: true
          script: |
            cd android && gradle --no-daemon connectedDebugAndroidTest || echo "TOUR_FAILED" > ../tour-failed
            mkdir -p ../android-shots && adb pull /sdcard/Android/data/com.ra7al.cartv/files/shots ../android-shots/ || true

      - name: Publish screenshots and test report
        if: always()
        run: |
          mkdir -p /tmp/out && cp -R android-shots/. /tmp/out/ 2>/dev/null || true
          cp -R android/app/build/outputs/androidTest-results /tmp/out/ 2>/dev/null || true
          cp -R android/app/build/test-results /tmp/out/unit-results 2>/dev/null || true
          [ -f tour-failed ] && cp tour-failed /tmp/out/ || true
          cd /tmp/out && git init -q && git checkout -q -b ci-screenshots-android
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Android screenshots ${GITHUB_SHA}" || exit 0
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots-android

      - name: Fail if the screen tour failed
        run: test ! -f tour-failed

      - name: Publish APK to the builds branch
        run: |
          REMOTE="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git"
          cp "$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release.apk" /tmp/RA7AL-CarTV.apk
          cd /tmp && rm -rf b
          if ! git clone -q --depth 1 -b builds "$REMOTE" b; then
            mkdir b && cd b && git init -q && git checkout -q -b builds && git remote add origin "$REMOTE" && cd ..
          fi
          cd b && cp /tmp/RA7AL-CarTV.apk . 
          git config user.name "github-actions" && git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Build ${GITHUB_SHA}" || exit 0
          git push -q origin builds || (git pull -q --rebase origin builds && git push -q origin builds)
