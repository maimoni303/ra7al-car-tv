name: RA7ALCarTV
options:
  bundleIdPrefix: com.ra7al
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  RA7ALCarTV:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes: ["Info.plist", "*.entitlements"]
    dependencies:
      - target: RA7ALBroadcast
        embed: true
        codeSign: true
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Car TV"
        CFBundleName: "RA7AL Car TV"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [ar, en]
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsArbitraryLoadsInWebContent: true
        NSLocalNetworkUsageDescription: "Play streams from servers on your home network."
        NSPhotoLibraryUsageDescription: "Import your videos to play them on the car screen."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: "$(PRODUCT_MODULE_NAME).CarPlaySceneDelegate"
    entitlements:
      path: Resources/RA7ALCarTV.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ra7al.cartv]
        # Granted by Apple to this App ID (CarPlay Video, Nov 2026).
        com.apple.developer.carplay-video: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ra7al.cartv
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false

  RA7ALBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: Broadcast
        excludes: ["Info.plist", "*.entitlements"]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: "Car TV Mirroring"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/RA7ALBroadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.com.ra7al.cartv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ra7al.cartv.broadcast
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: false
        APPLICATION_EXTENSION_API_ONLY: true

  RA7ALCarTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: RA7ALCarTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/RA7ALCarTV.app/RA7ALCarTV"

  RA7ALCarTVUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: RA7ALCarTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        TEST_TARGET_NAME: RA7ALCarTV

schemes:
  RA7ALCarTV:
    build:
      targets:
        RA7ALCarTV: all
        RA7ALCarTVTests: [test]
        RA7ALCarTVUITests: [test]
    test:
      targets:
        - RA7ALCarTVTests
        - RA7ALCarTVUITests
